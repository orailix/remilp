[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remilp"
version = "0.1.0"
description = "ReMILP: reformulation-contrastive representation learning for MILP"
requires-python = ">=3.11"
# Runtime dependencies are managed by pixi (pixi.toml).
dependencies = []

[project.scripts]
remilp = "remilp.cli:main"

[tool.setuptools.packages.find]
include = ["remilp*"]
